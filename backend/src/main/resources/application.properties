spring.application.name=my-wargame-app

# Secrets live in the repo-root .env (gitignored) or in real environment variables, never here.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/mywargame}
spring.datasource.username=${POSTGRES_USER:mywargame}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.ttl=7d
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
